name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: テスト
        run: npm test -- --watchAll=false
        env:
          CI: true
      # CI=true ではlint警告もエラーとして扱われる
      - name: ビルド
        run: npm run build
        env:
          CI: true
